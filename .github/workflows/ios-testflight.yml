name: iOS TestFlight Gönder (EAS)

on:
  workflow_dispatch:
    inputs:
      auto_submit:
        description: 'Derleme bitince otomatik TestFlight’a yükle (--auto-submit)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  testflight:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Expo & EAS CLI kur
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: iOS TestFlight derlemesini başlat
        run: |
          if [ "${{ inputs.auto_submit }}" = "true" ]; then
            eas build --platform ios --profile testflight --non-interactive --no-wait --auto-submit
          else
            eas build --platform ios --profile testflight --non-interactive --no-wait
          fi
